<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GBMAP Extractor</title>
<style>
  * { box-sizing: border-box; }
  body { font-family: system-ui, sans-serif; margin: 1rem; background:#111; color:#eee; }
  h1 { font-size: 1.15rem; }
  .box {
    border: 2px dashed #555; border-radius: 12px; padding: 1.2rem;
    text-align: center; margin-bottom: 1rem; position: relative;
  }
  .box.hover { border-color:#4af; background:#1a2a3a; }
  .file-btn {
    position: relative; display: inline-block; overflow: hidden;
    background:#4af; color:#000; padding: 14px 22px; border-radius: 8px;
    font-weight: 700; cursor: pointer; font-size: 16px;
  }
  .file-btn input[type=file] {
    position: absolute; inset: 0; width: 100%; height: 100%;
    opacity: 0; cursor: pointer; font-size: 100px;
  }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 10px 0; }
  button {
    background:#2a2a2a; color:#eee; border:1px solid #444;
    padding:10px 14px; border-radius:8px; cursor:pointer; font-size:14px;
  }
  button:hover { background:#3a3a3a; }
  button:disabled { opacity:.4; cursor:not-allowed; }
  #count { margin: 1rem 0; color:#9cf; font-size: 14px; }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
    gap: 10px; margin-top: 1rem;
  }
  .card {
    background:#1c1c1c; border:1px solid #333; border-radius:8px;
    padding: 8px; font-size: 12px; color:#bbb;
  }
  .card.bad { border-color:#5c1f1f; }
  .card img {
    width: 100%; height: 110px; object-fit: contain;
    background:#000; border-radius: 4px;
  }
  .card a {
    display: block; margin-top: 6px; color:#4af;
    text-decoration: none; word-break: break-all;
  }
  .card .warn { color:#f88; font-size: 11px; margin-top: 4px; }
  small { color:#888; }
</style>
</head>
<body>

<h1>GBMAP Extractor</h1>

<div class="box" id="drop">
  <div class="file-btn">
    Выбрать .gbmap
    <input type="file" id="file1" accept=".gbmap">
  </div>
  <div style="margin-top:10px;"><small>или перетащи .gbmap сюда</small></div>
</div>

<div class="row">
  <button id="downloadAll" disabled>Скачать все текстуры (ZIP)</button>
</div>

<div id="count"></div>
<div class="grid" id="grid"></div>

<script>
const countEl = document.getElementById('count');
const gridEl = document.getElementById('grid');
const btnZip = document.getElementById('downloadAll');
const drop = document.getElementById('drop');

let currentName = 'texture';
let textures = [];

function bindInput(id) {
  const el = document.getElementById(id);
  el.addEventListener('change', () => {
    if (el.files && el.files.length) handleFile(el.files[0]);
  });
}
bindInput('file1');

drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('hover'); });
drop.addEventListener('dragleave', () => drop.classList.remove('hover'));
drop.addEventListener('drop', e => {
  e.preventDefault(); drop.classList.remove('hover');
  if (e.dataTransfer.files.length) handleFile(e.dataTransfer.files[0]);
});

function isGzip(b) { return b.length >= 2 && b[0] === 0x1F && b[1] === 0x8B; }

async function gunzip(u8) {
  const ds = new DecompressionStream('gzip');
  const s = new Blob([u8]).stream().pipeThrough(ds);
  const ab = await new Response(s).arrayBuffer();
  return new Uint8Array(ab);
}

function extractJPEGs(buf) {
  const res = [];
  const n = buf.length;
  const validSeg = new Uint8Array(256);
  [0xE0,0xE1,0xE2,0xE3,0xE4,0xE5,0xE6,0xE7,0xE8,0xE9,0xEA,0xEB,0xEC,0xED,0xEE,0xEF,
   0xDB,0xC0,0xC1,0xC2,0xC3,0xC4,0xC5,0xC6,0xC7,0xC8,0xC9,0xCA,0xCB,0xCC,0xCD,0xCE,0xCF,
   0xDA,0xFE,0xD8,0xD9].forEach(v => validSeg[v] = 1);

  let i = 0;
  while (i < n - 3) {
    while (i < n - 1 && buf[i] !== 0xFF) i++;
    if (i >= n - 3) break;
    if (buf[i+1] === 0xD8 && buf[i+2] === 0xFF && validSeg[buf[i+3]]) {
      const start = i;
      let j = i + 2;
      let end = -1;
      while (j < n - 1) {
        if (buf[j] === 0xFF && buf[j+1] === 0xD9) { end = j + 2; break; }
        j++;
      }
      if (end > start) {
        res.push({ offset: start, length: end - start, data: buf.subarray(start, end) });
        i = end;
        continue;
      }
    }
    i++;
  }
  return res;
}

function checkJPEG(blob) {
  return new Promise(resolve => {
    const url = URL.createObjectURL(blob);
    const img = new Image();
    img.onload = () => { URL.revokeObjectURL(url); resolve(true); };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(false); };
    img.src = url;
  });
}

async function handleFile(file) {
  gridEl.innerHTML = '';
  countEl.textContent = '';
  textures = [];
  btnZip.disabled = true;
  currentName = file.name.replace(/\.[^.]+$/, '') || 'texture';

  let buf = new Uint8Array(await file.arrayBuffer());

  if (isGzip(buf)) {
    try { buf = await gunzip(buf); }
    catch (e) { countEl.textContent = 'Ошибка gzip: ' + e.message; return; }
  }

  textures = extractJPEGs(buf);

  const checks = textures.map(t => {
    const blob = new Blob([t.data], { type: 'image/jpeg' });
    return checkJPEG(blob).then(ok => ({ ok, blob }));
  });
  const results = await Promise.all(checks);

  results.forEach((r, i) => {
    const t = textures[i];
    const idx = String(i+1).padStart(4,'0');
    const url = URL.createObjectURL(r.blob);
    const card = document.createElement('div');
    card.className = 'card' + (r.ok ? '' : ' bad');
    const img = document.createElement('img');
    img.src = url;
    if (!r.ok) img.style.display = 'none';
    const info = document.createElement('div');
    info.textContent = `#${idx} • ${t.length} B`;
    const a = document.createElement('a');
    a.href = url;
    a.download = `${currentName}_${idx}.jpg`;
    a.textContent = 'скачать';
    card.append(img, info, a);
    if (!r.ok) {
      const w = document.createElement('div');
      w.className = 'warn';
      w.textContent = 'повреждено';
      card.appendChild(w);
    }
    gridEl.appendChild(card);
  });

  const okCount = results.filter(r => r.ok).length;
  const badCount = results.length - okCount;
  countEl.textContent = `Текстур: ${results.length}` + (badCount ? ` (повреждено: ${badCount})` : '');
  btnZip.disabled = okCount === 0;
}

btnZip.onclick = () => {
  if (!textures.length) return;
  const files = textures.map((t, i) => ({
    name: `${currentName}_${String(i+1).padStart(4,'0')}.jpg`,
    data: t.data
  }));
  const zipBlob = makeZip(files);
  const a = document.createElement('a');
  a.href = URL.createObjectURL(zipBlob);
  a.download = `${currentName}_textures.zip`;
  a.click();
};

function makeZip(files) {
  const enc = new TextEncoder();
  const chunks = [], central = [];
  let offset = 0;
  const crcTable = (() => {
    const t = new Uint32Array(256);
    for (let n = 0; n < 256; n++) {
      let c = n;
      for (let k = 0; k < 8; k++) c = (c & 1) ? (0xEDB88320 ^ (c >>> 1)) : (c >>> 1);
      t[n] = c >>> 0;
    }
    return t;
  })();
  function crc32(u8) {
    let c = 0xFFFFFFFF;
    for (let i = 0; i < u8.length; i++) c = crcTable[(c ^ u8[i]) & 0xFF] ^ (c >>> 8);
    return (c ^ 0xFFFFFFFF) >>> 0;
  }
  const u16 = v => new Uint8Array([v & 0xff, (v >> 8) & 0xff]);
  const u32 = v => new Uint8Array([v & 0xff, (v >> 8) & 0xff, (v >> 16) & 0xff, (v >> 24) & 0xff]);
  files.forEach(f => {
    const nb = enc.encode(f.name);
    const crc = crc32(f.data);
    const localOffset = offset;
    [u32(0x04034b50), u16(20), u16(0), u16(0), u16(0), u16(0),
     u32(crc), u32(f.data.length), u32(f.data.length),
     u16(nb.length), u16(0), nb].forEach(p => { chunks.push(p); offset += p.length; });
    chunks.push(f.data); offset += f.data.length;
    central.push([u32(0x02014b50), u16(20), u16(20), u16(0), u16(0), u16(0), u16(0),
      u32(crc), u32(f.data.length), u32(f.data.length),
      u16(nb.length), u16(0), u16(0), u16(0), u16(0), u32(0),
      u32(localOffset), nb]);
  });
  let centralSize = 0;
  central.forEach(entry => entry.forEach(p => { chunks.push(p); centralSize += p.length; }));
  const cdOffset = offset;
  [u32(0x06054b50), u16(0), u16(0), u16(files.length), u16(files.length),
   u32(centralSize), u32(cdOffset), u16(0)].forEach(p => chunks.push(p));
  return new Blob(chunks, { type: 'application/zip' });
}
</script>

</body>
</html>
